---
- hosts: "{{ host }}"
  remote_user: root

  tasks:
    - name: Configure apt download retries (resilient to transient Ubuntu-mirror failures)
      copy:
        dest: /etc/apt/apt.conf.d/99retries
        content: 'Acquire::Retries "8";'

    - name: Remove automatic updates
      apt:
        name: unattended-upgrades
        state: absent

    - name: Base dependencies
      apt:
        pkg:
          - nmap
          - ncat
          - python3
          - python3-pip
          - net-tools
          - unzip
        state: present
        update_cache: yes
