---
# playbooks/falco_elastic.yml
- name: Install Falco and forward alerts to Elasticsearch
  hosts: "{{ host }}"
  become: yes

  vars:
    # ---- Editable vars -------------------------------------------------
    falco_version: ""               # blank = latest from repo
    falcosidekick_version: "2.31.1" # pin if you like; blank = latest
    es_address: "https://elasticsearch.example.com:9200"  # Include protocol and port
    es_user: "elastic"
    es_password: "changeme"
    es_index: "falco"
    # -------------------------------------------------------------------

  tasks:
  - name: Configure apt download retries (resilient to transient Ubuntu-mirror failures)
    copy:
      dest: /etc/apt/apt.conf.d/99retries
      content: 'Acquire::Retries "8";'

  - name: Ensure base packages are present
    apt:
      name:
        - curl
        - gnupg
        - software-properties-common
        - apt-transport-https
        - clang
        - llvm
        - dkms
        - make
        - linux-headers-{{ ansible_kernel }}
      state: present
      update_cache: yes

  - name: Add Falco GPG key
    shell: |
      curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | \
      gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
    args:
      creates: /usr/share/keyrings/falco-archive-keyring.gpg

  - name: Add Falco apt repository
    shell: |
      echo "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] https://download.falco.org/packages/deb stable main" | \
      tee -a /etc/apt/sources.list.d/falcosecurity.list
    args:
      creates: /etc/apt/sources.list.d/falcosecurity.list

  # Falco's postinst auto-builds a driver (modern_ebpf then kmod via dkms) under
  # `set -e`; on kernel <5.8 (e.g. Ubuntu 20.04 / 5.4) modern_ebpf is unsupported
  # and this aborts dpkg --configure. Install the engine with the driver build
  # skipped, then attach the kmod explicitly via falcoctl.
  - name: Install Falco engine (driver build deferred)
    apt:
      name: "{{ 'falco=' + falco_version if falco_version else 'falco' }}"
      state: present
      update_cache: yes
    environment:
      FALCO_DRIVER_CHOICE: none
      FALCO_FRONTEND: noninteractive
      FALCOCTL_ENABLED: "no"

  - name: Configure falcoctl to use the kmod driver
    command: falcoctl driver config --type kmod
    changed_when: true

  - name: Ensure clean Falco driver state (so falcoctl can (re)install idempotently)
    shell: |
      systemctl stop falco-kmod falco-bpf falco-modern-bpf falco falcosidekick 2>/dev/null || true
      pkill -x falco 2>/dev/null || true
      rmmod falco 2>/dev/null || true
      exit 0
    changed_when: false

  - name: Install the Falco kmod driver (prebuilt download for this kernel, else dkms build)
    command: falcoctl driver install
    changed_when: true
    register: falco_driver_install
    failed_when: false

  - name: Make the kmod available to modprobe (copy into /lib/modules + depmod)
    shell: |
      set -e
      ko=$(ls /root/.falco/*/{{ ansible_architecture }}/falco_*.ko 2>/dev/null | head -1)
      test -n "$ko"
      mkdir -p /lib/modules/$(uname -r)/updates
      cp "$ko" /lib/modules/$(uname -r)/updates/falco.ko
      depmod -a
    changed_when: true

  - name: Create Falco configuration from template
    copy:
      src: falco.yaml
      dest: /etc/falco/falco.yaml
      mode: '0644'
    notify: Restart Falco

  - name: Determine architecture for falcosidekick
    set_fact:
      falcosidekick_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

  - name: Download and extract falcosidekick
    unarchive:
      src: "https://github.com/falcosecurity/falcosidekick/releases/download/{{ falcosidekick_version }}/falcosidekick_{{ falcosidekick_version }}_linux_{{ falcosidekick_arch }}.tar.gz"
      dest: /tmp
      remote_src: yes
      creates: /tmp/falcosidekick

  - name: Move falcosidekick binary to /usr/local/bin
    copy:
      src: /tmp/falcosidekick
      dest: /usr/local/bin/falcosidekick
      mode: "0755"
      remote_src: yes

  - name: Clean up temporary falcosidekick files
    file:
      path: /tmp/falcosidekick
      state: absent

  - name: Ensure falcosidekick config directory exists
    file:
      path: /etc/falcosidekick
      state: directory
      mode: "0755"

  - name: Create falcosidekick configuration file
    copy:
      dest: /etc/falcosidekick/config.yaml
      mode: "0644"
      content: |
        # Elasticsearch configuration
        elasticsearch:
          hostport: "{{ es_address }}"
          username: "{{ es_user }}"
          password: "{{ es_password }}"
          checkcert: false
          suffix: "none"
          index: "{{ es_index }}"

  - name: Create falcosidekick systemd unit
    copy:
      dest: /etc/systemd/system/falcosidekick.service
      mode: "0644"
      content: |
        [Unit]
        Description=Falco Sidekick
        After=network.target

        [Service]
        Type=simple
        ExecStart=/usr/local/bin/falcosidekick -c /etc/falcosidekick/config.yaml
        Restart=on-failure
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
    notify: Reload systemd

  - name: Enable & start services
    systemd:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
      - falco-kmod
      - falcosidekick

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes
    - name: Restart Falco
      systemd:
        name: falco-kmod
        state: restarted
